# ServiceNow MCP Tool Packages Configuration
# Define sets of tools to be exposed by the MCP server based on roles/workflows.
# The MCP server loads tools based on the MCP_TOOL_PACKAGE environment variable.
# If MCP_TOOL_PACKAGE is not set, 'full' is loaded.
# If MCP_TOOL_PACKAGE is set to 'none', no tools are loaded (except list_tool_packages).

# --- Package Definitions ---

none: []

service_desk:
  # Generic Table API — agents use this for all CRUD; domain-specific wrappers removed
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record

catalog_builder:
  # Generic Table API — agents use this for all catalog CRUD; domain-specific wrappers removed
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record
  # Generic Table API — use query_records/create_record/update_record on item_option_new for catalog variable CRUD
  # Compound: bulk move items between categories
  - move_catalog_items
  # Optimization
  - get_optimization_recommendations

request_fulfillment:
  # Service Request lifecycle — sc_request / sc_req_item (RITM) / sc_task
  # CRUD (list_requests, get_request, list_request_items, update_request_item,
  # list_sc_tasks, update_sc_task) via table_tools + architecture blueprint.
  # Compound:
  - get_ritm_variables
  # Core verification + metadata
  # Choice field values: use query_records on sys_choice
  # (filter: name=<table>^element=<field>^inactive=false)
  - verify_fields
  - get_field_metadata
  # Generic Table API (CRUD for sc_request / sc_req_item / sc_task)
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record

change_coordinator:
  # Compound approval workflow — multi-step cross-table operations
  - submit_change_for_approval
  - approve_change
  - reject_change
  # Generic Table API — agents use this for all change CRUD; architecture doc is the guide
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record

