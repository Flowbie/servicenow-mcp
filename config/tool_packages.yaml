executor:
  # Minimum required tools for the Executor agent pattern.
  # Always contains: pre-flight, write verification tools.
  # Add write tools for the specific domain (e.g. script_include_tools, change_tools)
  # to the active package when the Executor is invoked for that domain.
  #
  # Diagnostic queries now use query_records directly:
  # - sys_choice (field choices)
  # - sys_data_policy2 (data policies)
  # - dl_definition (data lookup rules)
  # - sys_script (business rules)
  # - sys_ui_policy_action (UI policies)
  #
  # Read-only / protocol tools (always required by Executor):
  - verify_fields
  - get_field_metadata
  # Introspection (pre-flight blueprint check):
  # Table metadata / child tables: use query_records on sys_db_object
  - list_table_fields
  - list_table_relationships
  # Generic Table API (CRUD default for modules without domain-specific tools):
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record
  # System:
  - get_current_user
  # Changeset (update set management — CRUD via table_tools + sys_update_set blueprint):
  - get_current_scope
  - get_current_update_set
  - set_current_scope
  - set_current_update_set
  # Workbench UI tools — only activate when WORKBENCH_MCP_URL is set (distinct
  # from the legacy WORKBENCH_URL used by approval_client.py). Raise a
  # structured RuntimeError otherwise. Safe to include in CLI packages.
  # See ADR-0002 in servicenow-workbench/docs/architecture/.
  - workbench_present_questionnaire
  - workbench_get_answers
  - workbench_present_artifact
  - workbench_log_execution
  - workbench_get_artifact
  - workbench_list_artifacts
  - workbench_delete_artifact

