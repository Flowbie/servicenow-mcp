  # Incident Management
  - create_incident
  - update_incident
  - add_comment
  - resolve_incident
  - list_incidents
  - get_incident_by_number
  # User Lookup
  - get_user
  - list_users
  # Knowledge Lookup
  - get_article
  - list_articles

