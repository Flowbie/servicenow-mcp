# ServiceNow MCP Tool Packages Configuration
# Define sets of tools to be exposed by the MCP server based on roles/workflows.
# The MCP server loads tools based on the MCP_TOOL_PACKAGE environment variable.
# If MCP_TOOL_PACKAGE is not set, 'full' is loaded.
# If MCP_TOOL_PACKAGE is set to 'none', no tools are loaded (except list_tool_packages).

# --- Package Definitions ---

none: []

service_desk:
  # Generic Table API — agents use this for all CRUD; domain-specific wrappers removed
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record

catalog_builder:
  # Generic Table API — agents use this for all catalog CRUD; domain-specific wrappers removed
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record
  # Compound: bulk move items between categories
  - move_catalog_items
  # Variables
  - create_catalog_item_variable
  - list_catalog_item_variables
  - update_catalog_item_variable
  # planned: Epic 10 — delete_catalog_item_variable, create_catalog_variable_choice
  # Optimization
  - get_optimization_recommendations

request_fulfillment:
  # Service Request lifecycle — sc_request / sc_req_item (RITM) / sc_task
  # CRUD (list_requests, get_request, list_request_items, update_request_item,
  # list_sc_tasks, update_sc_task) via table_tools + architecture blueprint.
  # Compound:
  - get_ritm_variables
  # Core verification + lookup
  - verify_fields
  - get_field_metadata
  - get_field_choices
  # Generic Table API (CRUD for sc_request / sc_req_item / sc_task)
  - query_records
  - get_record
  - create_record
  - update_record
  - delete_record

