# The MCP server loads tools based on the MCP_TOOL_PACKAGE environment variable.
# If MCP_TOOL_PACKAGE is not set, 'executor' is loaded (safe default: Table API + verification).
# Set MCP_TOOL_PACKAGE=full to load all tools. Set to 'none' to load no tools (introspection only).

